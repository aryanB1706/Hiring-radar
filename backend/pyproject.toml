[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = '-m "not live and not model"'
markers = [
    "live: calls the real Gemini API; needs GEMINI_API_KEY (run with `pytest -m live`)",
    "model: loads the real embedding model, downloads ~90 MB (run with `pytest -m model`)",
]
pythonpath = ["."]
